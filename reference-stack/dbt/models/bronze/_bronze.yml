version: 2

models:
  - name: brz_channels
    description: Channels, 1:1 with the source.
    columns:
      - name: channel_code
        data_tests: [not_null, unique]
      - name: kind
        data_tests:
          - accepted_values:
              arguments:
                values: [buy, transfer]

  - name: brz_products
    description: Products, 1:1 with the source.
    columns:
      - name: sku
        data_tests: [not_null, unique]
      - name: case_size
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true

  - name: brz_orders
    description: Order headers, every loaded version.
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: loaded_at
        data_tests: [not_null]

  - name: brz_order_lines
    description: Order lines, every loaded version.
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: line_no
        data_tests: [not_null]
      - name: quantity
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true

  - name: brz_inventory_snapshots
    description: Daily stock snapshots, every loaded version.
    columns:
      - name: on_hand
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
